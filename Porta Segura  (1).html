<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Porta Segura</title>
<style>
:root { box-sizing: border-box; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1419; --card: #161b22; --border: #30363d; --pr: #1f6feb; --text: #c9d1d9; }
}
:root[data-theme="dark"] { --bg: #0f1419; --card: #161b22; --border: #30363d; --pr: #1f6feb; --text: #c9d1d9; }
html { scroll-padding-top: env(safe-area-inset-top); }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
h1 { font-size: 19px; margin: 4px 0 2px; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px; }
.clock { font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 6px; overflow-x: auto; padding: 0 12px 12px; }
nav button { flex: none; border: 1px solid var(--border); background: var(--card); color: var(--text); padding: 8px 14px; border-radius: 6px; cursor: pointer; }
nav button.on { background: var(--pr); color: #fff; border-color: var(--pr); }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin: 12px; }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.kpi { font-size: 28px; font-weight: 700; }
label { display: block; font-size: 12px; color: var(--text); margin-bottom: 4px; }
input, select { width: 100%; padding: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; margin-bottom: 10px; }
.btn { border: 0; border-radius: 8px; padding: 11px; background: var(--pr); color: #fff; width: 100%; font-weight: 650; cursor: pointer; }
</style>
</head>
<body>
  <div class="top">
    <h1>Porta Segura</h1>
    <div class="clock" id="clock">00:00</div>
  </div>
  
  <nav>
    <button class="on">Início</button>
    <button>Registos</button>
    <button>Definições</button>
  </nav>

  <div class="card">
    <div class="grid">
      <div>
        <label>Estado</label>
        <div class="kpi">Ativo</div>
      </div>
    </div>
  </div>

  <script>
    setInterval(() => {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('pt-PT', {hour: '2-digit', minute:'2-digit'});
    }, 1000);
  </script>
</body>
</html>
